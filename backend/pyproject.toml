[project]
name = "famapp-backend"
version = "0.0.0"
description = "famapp API and worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "apscheduler>=3.11,<4",
    "cryptography>=44",
    "fastapi>=0.162",
    "httpx2>=2.16",
    "jinja2>=3.1",
    "pydantic-settings>=2.16",
    "pyjwt[crypto]>=2.15",
    "pymysql>=1.2",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "mariadb: needs a real MariaDB (concurrency, locks); runs only when DATABASE_URL points at MariaDB (CI job backend-mariadb)",
]
