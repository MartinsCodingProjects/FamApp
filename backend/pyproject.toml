[project]
name = "famapp-backend"
version = "0.0.0"
description = "famapp API and worker"
requires-python = ">=3.12"
dependencies = [
    "pymysql>=1.2",
    "sqlalchemy>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "mariadb: needs a real MariaDB (concurrency, locks); runs only when DATABASE_URL points at MariaDB (CI job backend-mariadb)",
]
