# CI override for tools/image-smoke.sh: deploy/docker-compose.yml plus a MariaDB and test values.
# Throwaway values for a CI-only stack, not secrets.
services:
  mariadb:
    image: mariadb:11.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: famapp
      MARIADB_USER: famapp
      MARIADB_PASSWORD: famapp
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  api:
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy

  worker:
    depends_on:
      mariadb:
        condition: service_healthy
