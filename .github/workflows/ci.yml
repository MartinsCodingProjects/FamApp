name: ci

# Path filtering happens in the `changes` job and job-level `if:` conditions, never in a
# workflow-level `paths:` filter: `ci-gate` is the only required check and must always run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      app: ${{ steps.areas.outputs.app }}
      shared: ${{ steps.areas.outputs.shared }}
      tools: ${{ steps.areas.outputs.tools }}
      docs: ${{ steps.areas.outputs.docs }}
      has_backend: ${{ steps.areas.outputs.has_backend }}
      has_app: ${{ steps.areas.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$PR_BASE...$PR_HEAD" | tools/ci-changes.sh > areas.txt
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" | tools/ci-changes.sh > areas.txt
          else
            tools/ci-changes.sh --all > areas.txt
          fi
          cat areas.txt
          cat areas.txt >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ hashFiles('tools/ktlint.sh', 'tools/actionlint.sh') }}
      - run: uv sync --project tools
      - run: npm ci --no-fund --no-audit
      - run: make lint

  tools-test:
    needs: changes
    if: needs.changes.outputs.tools == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: make test-tools

  backend-sqlite:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: make test-backend

  backend-mariadb:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    env:
      # Throwaway credentials of a CI-only container, not a secret.
      DATABASE_URL: mysql+pymysql://famapp:famapp@127.0.0.1:3306/famapp_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # docker-compose.dev.yml instead of `services:`: service containers cannot take server
      # arguments, and the collation must be set on the server (A7). Also tests the compose file.
      - name: Start MariaDB and fake FCM (docker-compose.dev.yml)
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - name: Check charset and collation
        run: |
          result="$(docker compose -f docker-compose.dev.yml exec -T mariadb mariadb -ufamapp -pfamapp famapp_test -N -e \
            'SELECT @@character_set_database, @@collation_database')"
          echo "$result"
          [ "$(echo "$result" | tr -s '[:space:]' ' ' | xargs)" = "utf8mb4 utf8mb4_unicode_ci" ]
      - run: make test-backend
      - name: Fake FCM answers
        run: curl -sSf http://127.0.0.1:9101/fake/health

  image:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: tools/image-smoke.sh

  e2e:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: e2e-results
          if-no-files-found: ignore

  js-test:
    needs: changes
    if: needs.changes.outputs.has_app == 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: make test-js

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: make audit

  apk:
    needs: changes
    if: needs.changes.outputs.has_app == 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      # Release variant (JS bundled) signed with the Android debug key. Real signing only in release.yml.
      - run: make apk
      - uses: actions/upload-artifact@v7
        with:
          name: app-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  emulator:
    needs: [changes, apk]
    # Runs when app/ or shared/ changed; before the Expo project existed it only booted the emulator.
    if: >-
      always() && needs.changes.result == 'success'
      && (needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true')
      && (needs.apk.result == 'success' || needs.apk.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        if: needs.changes.outputs.has_app == 'true'
        with:
          name: app-apk
          path: apk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        if: needs.changes.outputs.has_app == 'true'
        run: curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION=2.11.0 bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: tools/emulator-suite.sh "$(ls apk/*.apk 2>/dev/null | head -1)"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: e2e-results
          if-no-files-found: ignore

  ci-gate:
    if: always()
    needs: [changes, lint, tools-test, backend-sqlite, backend-mariadb, image, e2e, js-test, audit, apk, emulator]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "a required job failed or was cancelled"
            exit 1
          fi
